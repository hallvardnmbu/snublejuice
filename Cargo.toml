[workspace]
members = [
    "crates/authentication",
    "crates/shared",
    "crates/database",
    "crates/frontend",
    "crates/api",
    "crates/server"
]
resolver = "3"

[workspace.dependencies]
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["cookie"] }
chrono = "0.4.44"
regex = "1.12.3"
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pin until cookie/bson fix blanket From impl conflicts with time 0.3.48+
time = "=0.3.47"
tokio = "1.50.0"
tower-http = "0.6.8"
