{% macro adv_field(label, class="", id="") %}
<div{% if id %} id="{{ id }}"{% endif %}{% if class %} class="{{ class }}"{% endif %}>
    <span class="label">{{ label }}</span>
    {{ caller() }}
</div>
{% endmacro %}

{# Checkbox list styled as a select; options are filled in by dropdowns.js. #}
{% macro multiselect(id, name, default) %}
<details class="multiselect" id="{{ id }}" data-name="{{ name }}">
    <summary data-default="{{ default }}">{{ default }}</summary>
    <div class="card"></div>
</details>
{% endmacro %}
