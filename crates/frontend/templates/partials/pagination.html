<nav aria-label="Pagination">
    <button {% if page <= 1 %}disabled{% endif %} {% if page > 1 %}onclick="changePage({{ page - 1 }})"{% endif %} aria-label="Forrige side">←</button>
    <span>{{ page }} av {{ max_page }}</span>
    <button {% if page >= max_page %}disabled{% endif %} {% if page < max_page %}onclick="changePage({{ page + 1 }})"{% endif %} aria-label="Neste side">→</button>
</nav>
