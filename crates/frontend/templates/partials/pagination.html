<nav aria-label="Pagination" data-placement="{{ placement }}">
    <button type="button" data-page="{{ page - 1 }}" {% if page <= 1 %}disabled{% endif %} aria-label="Forrige side">←</button>
    <span>{{ page }} av {{ max_page }}</span>
    <button type="button" data-page="{{ page + 1 }}" {% if page >= max_page %}disabled{% endif %} aria-label="Neste side">→</button>
</nav>
